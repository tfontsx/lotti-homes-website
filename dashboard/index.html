<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Dashboard | Lotti Homes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,300;0,400;1,300;1,400&amp;family=Geist:wght@300;400;500;600&amp;family=Archivo:wght@500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dashboard.css?v=21">
<link rel="stylesheet" href="css/screens.css?v=37">
<link rel="stylesheet" href="css/screens2.css?v=35">
<link rel="stylesheet" href="css/fx.css?v=12">
<script>
  // Apply the saved theme (or the device's) before anything paints.
  (function () {
    var t = null;
    try { t = localStorage.getItem('lh-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
    // The logo intro plays once per browser session, and never for people who prefer less motion.
    try { if (!sessionStorage.getItem('lh-intro') && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) document.documentElement.classList.add('intro-on'); } catch (e) {}
  })();
</script>
</head>
<body>

<div class="intro" id="intro" aria-hidden="true"><div class="intro-in"><div class="intro-logo"></div><div class="intro-word">LOTTI HOMES</div><div class="intro-bar"><i></i></div></div><div class="intro-tag">FROM VISION TO REALITY</div></div>

<!-- Sign in -->
<main class="lh-login" id="login" hidden>
  <form class="lh-login-card" id="loginForm" novalidate autocomplete="on">
    <span class="lh-login-mark" data-mark></span>
    <p class="sub">Sign in with your admin account.</p>
    <label class="lh-field"><span class="cap">Email</span>
      <input class="lh-input" type="email" id="email" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    </label>
    <label class="lh-field"><span class="cap">Password</span>
      <input class="lh-input" type="password" id="password" autocomplete="current-password" required>
    </label>
    <button class="lh-btn primary block" type="submit" id="loginBtn">Sign in</button>
    <p class="lh-error" id="loginError" role="alert"></p>
  </form>
</main>

<!-- Dashboard -->
<div class="lh-app" id="app" hidden>
  <nav class="lh-rail" id="rail" aria-label="Main"></nav>
  <div class="lh-main">
    <div class="lh-bloom" aria-hidden="true"></div>
    <header class="lh-top">
      <div class="lh-search">
        <span class="si" aria-hidden="true"></span>
        <input id="search" type="search" placeholder="Search projects, leads, clients, contractors" autocomplete="off" aria-label="Search">
        <kbd>⌘K</kbd>
        <div class="lh-results" id="results" hidden></div>
      </div>
      <div class="grow"></div>
      <div class="lh-sync"><span class="lh-dot" id="syncDot"></span><span id="syncText">Synced with app</span></div>
      <span class="lh-vr" id="topVr" hidden></span>
      <span class="lh-topwx" id="topWx" hidden></span>
      <button class="lh-icon-btn" id="themeBtn" type="button" aria-label="Switch between light and dark"></button>
      <button class="lh-avatar" id="avatarBtn" type="button" aria-haspopup="true" aria-label="Account"></button>
      <div class="lh-menu" id="menu" hidden>
        <div class="who"><div id="menuName"></div><div class="faint" id="menuEmail" style="font-size:12px"></div></div>
        <button type="button" id="signOutBtn">Sign out</button>
      </div>
    </header>
    <main class="lh-page" id="view" tabindex="-1"></main>
  </div>
</div>

<script src="js/mark.js?v=2"></script>
<script src="js/intro.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js" integrity="sha384-rwykjmWNwVxboyFmvK9OXN0wj9hnMHA2aAHtits54DuACyCq0M2PrSNxhRb+hvXT" crossorigin="anonymous"></script>
<script src="../js/supabase-config.js?v=2"></script>
<script src="js/core.js?v=26"></script>
<script src="js/ui.js?v=7"></script>
<script src="js/fx.js?v=3"></script>
<script src="js/overview.js?v=19"></script>
<script src="js/leads.js?v=30"></script>
<script src="js/projects.js?v=39"></script>
<script src="js/schedule.js?v=19"></script>
<script src="js/contractors.js?v=17"></script>
<script src="js/inbox.js?v=17"></script>
<script src="js/reviews.js?v=1"></script>
<script src="js/reports.js?v=20"></script>
<script src="js/settings.js?v=18"></script>
<script src="js/compliance.js?v=19"></script>
<script src="js/soon.js?v=1"></script>
<script src="js/boot.js?v=1"></script>
</body>
</html>
